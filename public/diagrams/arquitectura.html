<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Arquitectura de FutFemColombia: Next.js, Supabase y fuentes de datos de fútbol femenino.">
  <title>Arquitectura de FutFemColombia</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { min-width: 320px; background: #3a0835; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 32px;
      color: #fdecfa;
      background: #3a0835;
      font-family: 'Orbitron', system-ui, sans-serif;
    }
    .frame { width: 100%; max-width: 1280px; margin: 0 auto; }
    h1 {
      margin: 0 0 24px;
      color: #fdecfa;
      font: 500 28px/1.15 'Orbitron', system-ui, sans-serif;
      letter-spacing: -.02em;
      text-align: center;
    }
    .scroll-hint { display: none; }
    .diagram-container {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      scrollbar-color: #922386 #3a0835;
      scrollbar-width: thin;
    }
    .diagram-container::-webkit-scrollbar { height: 8px; }
    .diagram-container::-webkit-scrollbar-track { background: #3a0835; }
    .diagram-container::-webkit-scrollbar-thumb { background: #922386; border-radius: 4px; }
    .diagram-container:focus-visible { outline: 2px solid #f371e2; outline-offset: 4px; }
    svg { display: block; width: 100%; min-width: 1280px; }
    svg text:not(.connector-label):not([fill="#fdecfa"]):not([fill="#f5f5f5"]) { fill: #fbd6f5; }
    svg text[fill="#f5f5f5"] { fill: #fdecfa; }
    svg text { font-family: 'Orbitron', system-ui, sans-serif !important; }
    @media (max-width: 700px) {
      body { padding: 28px 16px; }
      h1 { margin-bottom: 12px; }
      .scroll-hint {
        display: block;
        width: 100%;
        max-width: calc(100vw - 32px);
        margin: 0 0 12px;
        color: #fbd6f5;
        font: 400 12px/1.5 'Orbitron', system-ui, sans-serif;
      }
    }
    @media print {
      body { padding: 12px; }
      .diagram-container { overflow: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Arquitectura de FutFemColombia</h1>
    <p class="scroll-hint">Desplaza horizontalmente para ver el diagrama completo.</p>
    <figure class="diagram-container" tabindex="0" aria-label="Diagrama de arquitectura desplazable horizontalmente">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitectura-dark-title arquitectura-dark-desc">
        <title id="arquitectura-dark-title">Arquitectura de FutFemColombia</title>
        <desc id="arquitectura-dark-desc">Visitantes y administradores usan páginas de Next.js; el servidor consulta Supabase y los scrapers incorporan datos de WinSports y Dimayor.</desc>
        <defs>
          <marker id="arquitectura-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arquitectura-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arquitectura-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
        </defs>
        <rect width="1280" height="720" fill="#3a0835"/>

        <g fill="rgba(243,113,226,0.025)" stroke="rgba(243,113,226,0.16)" stroke-width="1">
          <rect x="210" y="112" width="310" height="470" rx="8"/>
          <rect x="550" y="112" width="360" height="470" rx="8"/>
          <rect x="940" y="112" width="316" height="470" rx="8"/>
        </g>
        <g fill="#3a0835">
          <rect x="309" y="118" width="112" height="16" rx="2"/>
          <rect x="679" y="118" width="102" height="16" rx="2"/>
          <rect x="1010" y="118" width="176" height="16" rx="2"/>
        </g>
        <g fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="1.1">
          <text x="365" y="130" fill="#bfc0c0" text-anchor="middle">EXPERIENCIA</text>
          <text x="730" y="130" fill="#bfc0c0" text-anchor="middle">APLICACIÓN</text>
          <text x="1098" y="130" fill="#bfc0c0" text-anchor="middle">DATOS + INTEGRACIONES</text>
        </g>

        <!-- Orthogonal data paths, routed behind the nodes. -->
        <path d="M172 244 H240" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M172 474 H240" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M488 244 H590" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M488 474 H528 Q536 474 536 466 V329 Q536 321 544 321 H634 Q642 321 642 313 V304" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M730 304 V410" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M870 244 H978" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
        <path d="M870 444 H900 Q908 444 908 436 V353 Q908 345 916 345 H1090 Q1098 345 1098 337 V304" fill="none" stroke="#f08a59" stroke-width="1.5" marker-end="url(#arquitectura-arrow-accent)"/>
        <path d="M978 502 H870" fill="none" stroke="#6a95d8" stroke-width="1.4" marker-end="url(#arquitectura-arrow-link)"/>

        <g font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">
          <rect x="512" y="224" width="52" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="538" y="233" fill="#bfc0c0" letter-spacing=".4">PÁGINAS</text>
          <rect x="544" y="384" width="62" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="575" y="393" fill="#bfc0c0" letter-spacing=".3">ADMIN API</text>
          <rect x="740" y="350" width="54" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="767" y="359" fill="#bfc0c0" letter-spacing=".3">DOMINIO</text>
          <rect x="896" y="224" width="56" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="924" y="233" fill="#bfc0c0" letter-spacing=".3">LECTURAS</text>
          <rect x="970" y="325" width="54" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="997" y="334" fill="#f08a59" letter-spacing=".3">UPSERT</text>
          <rect x="894" y="482" width="54" height="12" rx="2" fill="#3a0835"/>
          <text class="connector-label" x="921" y="491" fill="#8fb1e4" letter-spacing=".2">API / HTML</text>
        </g>

        <!-- People and entry points. -->
        <g>
          <rect x="32" y="204" width="140" height="80" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.16)"/>
          <rect x="44" y="215" width="42" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="65" y="225" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">WEB</text>
          <text x="102" y="254" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Visitante</text>
          <text x="102" y="270" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">consulta la liga</text>
        </g>
        <g>
          <rect x="32" y="434" width="140" height="80" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.16)"/>
          <rect x="44" y="445" width="48" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="68" y="455" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">ADMIN</text>
          <text x="102" y="484" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Administrador</text>
          <text x="102" y="500" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">gestiona contenido</text>
        </g>

        <!-- Next.js public and administrative interfaces. -->
        <g>
          <rect x="240" y="184" width="248" height="120" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.18)"/>
          <rect x="252" y="196" width="38" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="271" y="206" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">WEB</text>
          <text x="364" y="243" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sitio público</text>
          <text x="364" y="262" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">/, /equipos/[slug]</text>
          <text x="364" y="278" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">/cuadrangulares</text>
        </g>
        <g>
          <rect x="240" y="410" width="248" height="128" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.18)"/>
          <rect x="252" y="422" width="46" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="275" y="432" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">ADMIN</text>
          <text x="364" y="469" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Panel de administración</text>
          <text x="364" y="489" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">equipos, partidos, tablas</text>
          <text x="364" y="505" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">temporadas, goleadoras, scrapers</text>
        </g>

        <!-- Server-side application and domain services. -->
        <g>
          <rect x="590" y="184" width="280" height="120" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.20)"/>
          <rect x="602" y="196" width="48" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="626" y="206" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">SERVER</text>
          <text x="730" y="243" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Next.js App Router</text>
          <text x="730" y="262" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">Server Components / Route Handlers</text>
          <text x="730" y="278" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">API pública + autorización admin</text>
        </g>
        <g>
          <rect x="590" y="410" width="280" height="128" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.20)"/>
          <rect x="602" y="422" width="58" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.55)" stroke-width=".8"/>
          <text x="631" y="432" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DOMAIN</text>
          <text x="730" y="469" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Lógica de liga + scrapers</text>
          <text x="730" y="489" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">obtiene, normaliza, previsualiza</text>
          <text x="730" y="505" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">aplica datos y actualiza la liga</text>
        </g>

        <!-- Supabase and the external data providers. -->
        <g>
          <rect x="978" y="184" width="240" height="120" rx="6" fill="#66155d" stroke="#f371e2" stroke-width="1.2"/>
          <rect x="990" y="196" width="42" height="14" rx="2" fill="rgba(243,113,226,0.10)" stroke="#f371e2" stroke-width=".8"/>
          <text x="1011" y="206" fill="#f371e2" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DATA</text>
          <text x="1098" y="243" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Supabase</text>
          <text x="1098" y="262" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">Auth + PostgreSQL</text>
          <text x="1098" y="279" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">teams, matches, standings</text>
          <text x="1098" y="295" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">seasons, scorers, fase final</text>
        </g>
        <g>
          <rect x="978" y="456" width="240" height="92" rx="6" fill="#66155d" stroke="rgba(243,113,226,0.7)"/>
          <rect x="990" y="468" width="58" height="14" rx="2" fill="none" stroke="rgba(243,113,226,0.8)" stroke-width=".8"/>
          <text x="1019" y="478" fill="#8fb1e4" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">EXTERNAL</text>
          <text x="1098" y="506" fill="#f5f5f5" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Fuentes de fútbol</text>
          <text x="1098" y="525" fill="#bfc0c0" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">WinSports API, Dimayor AJAX / HTML</text>
        </g>

        <line x1="32" y1="626" x2="1248" y2="626" stroke="rgba(243,113,226,0.20)" stroke-width=".8"/>
        <g font-family="'Geist Mono', monospace" font-size="8">
          <text x="32" y="650" fill="#bfc0c0" font-weight="500" letter-spacing="1.1">FLUJOS</text>
          <line x1="100" y1="647" x2="136" y2="647" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arquitectura-arrow)"/>
          <text x="146" y="650" fill="#bfc0c0">APP / CONSULTA</text>
          <line x1="286" y1="647" x2="322" y2="647" stroke="#f08a59" stroke-width="1.5" marker-end="url(#arquitectura-arrow-accent)"/>
          <text x="332" y="650" fill="#bfc0c0">ESCRITURA EN SUPABASE</text>
          <line x1="510" y1="647" x2="546" y2="647" stroke="#6a95d8" stroke-width="1.4" marker-end="url(#arquitectura-arrow-link)"/>
          <text x="556" y="650" fill="#bfc0c0">FUENTE EXTERNA</text>
        </g>
      </svg>
    </figure>
  </main>
</body>
</html>
